<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            FitnessFY
        {% endblock %}
    </title>

    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='icons/favicon.png') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/base.css') }}"
    >

    {% block extra_css %}{% endblock %}

</head>

<body>

    {% include "header.html" %}

    <main>

        {% block content %}{% endblock %}

    </main>

    <footer>

        <p>
            © 2026 FitnessFY - Saúde & Bem-Estar
        </p>

    </footer>

    <script
        src="{{ url_for('static', filename='js/script.js') }}"
    ></script>

    {% block extra_js %}{% endblock %}

</body>

</html>
